name: ARM Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      package_version:
        required: false
        type: string

jobs:
  arm-native:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            platform-flag: ''
            artifact-name: Ubuntu-22.04-arm64v8
          - image: arm32v7/ubuntu:22.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-22.04-arm32v7

          - image: ubuntu:26.04
            platform-flag: ''
            artifact-name: Ubuntu-26.04-arm64v8
          - image: arm32v7/ubuntu:26.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-26.04-arm32v7

          - image: debian:bookworm
            platform-flag: ''
            artifact-name: Debian-12-arm64
          - image: arm32v7/debian:bookworm
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-12-armhf

          - image: debian:trixie
            platform-flag: ''
            artifact-name: Debian-13-arm64
          - image: arm32v7/debian:trixie
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-13-armhf
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Setup Python venv and install dependencies
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests 

      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.TEST_REPO_CLOUDSMITH_TOKEN }}
          PYTHON: /tmp/cloudsmith-venv/bin/python3
        run: |
          set -e
          wget -q https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O /tmp/cloudsmith_helper.py
          mkdir -p build && cd build
          $PYTHON /tmp/cloudsmith_helper.py \
            --method get_artifacts_from_location \
            --repo external \
            --package_version "libiio-v0~latest" \
            --package_name "${{ matrix.artifact-name }}.deb"

      - name: Build
        run: |
          set -e
          docker run \
            ${{ matrix.platform-flag }} \
            --rm -t --privileged \
            -e ARTIFACTNAME=${{ matrix.artifact-name }} \
            -v "${{ github.workspace }}":"/ci" \
            "${{ matrix.image }}" \
            /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential cmake git libxml2-dev python3-setuptools
              cd /ci
              bash ./CI/travis/ci-ubuntu.sh
            "

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/*9361*.deb
            build/*9361*.tar.gz

  cross-arch:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            arch: ppc64le
            artifact-name: Ubuntu-22.04-ppc64le
          - image: ubuntu:22.04
            arch: s390x
            artifact-name: Ubuntu-22.04-s390x
          - image: ubuntu:26.04
            arch: ppc64le
            artifact-name: Ubuntu-26.04-ppc64le
          - image: ubuntu:26.04
            arch: s390x
            artifact-name: Ubuntu-26.04-s390x
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Setup Python venv and install dependencies
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests

      - name: Get libiio from Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          PYTHON: /tmp/cloudsmith-venv/bin/python3
        run: |
          set -e
          wget -q https://raw.githubusercontent.com/analogdevicesinc/wiki-scripts/refs/heads/main/utils/cloudsmith_utils/cloudsmith_helper.py \
            -O /tmp/cloudsmith_helper.py
          mkdir -p build && cd build
          $PYTHON /tmp/cloudsmith_helper.py \
            --method get_artifacts_from_location \
            --repo external \
            --package_version "libiio-v0~latest" \
            --package_name "${{ matrix.artifact-name }}.deb"

      - name: Build
        run: |
          set -e
          sudo docker run \
            --platform "linux/${{ matrix.arch }}" \
            --rm -t --privileged \
            -e ARTIFACTNAME=${{ matrix.artifact-name }} \
            -v "${{ github.workspace }}":"/ci" \
            "${{ matrix.image }}" \
            /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential cmake git libxml2-dev python3-setuptools
              cd /ci
              bash ./CI/travis/ci-ubuntu.sh
            "

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/*9361*.deb
            build/*9361*.tar.gz
