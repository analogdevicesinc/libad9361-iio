name: Linux Builds

on:
  workflow_call:
    inputs:
      download_branch:
        required: true
        type: string
      checkout_ref:
        required: false
        type: string
        default: ''
      is_main:
        required: false
        type: string
        default: 'false'

permissions:
  contents: read

jobs:
  linux-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu_22_04_x86_64
            image: 'tfcollins/libiio_ubuntu_22_04-ci:latest'
            artifactName: 'Linux-Ubuntu-22.04'
            build_script: ci-linux.sh
            OS_TYPE: default
            PACKAGE_TO_INSTALL: '/ci/build/*.deb'
          - name: ubuntu_24_04_x86_64
            image: 'tfcollins/libiio_ubuntu_24_04-ci:latest'
            artifactName: 'Linux-Ubuntu-24.04'
            build_script: ci-linux.sh
            OS_TYPE: default
            PACKAGE_TO_INSTALL: '/ci/build/*.deb'
          - name: debian_bullseye
            image: 'tfcollins/libiio_debian_bullseye-ci:latest'
            artifactName: 'Linux-Debian-11'
            build_script: ci-linux.sh
            OS_TYPE: default
            PACKAGE_TO_INSTALL: '/ci/build/*.deb'
          - name: debian_bookworm
            image: 'tfcollins/libiio_debian_bookworm-ci:latest'
            artifactName: 'Linux-Debian-12'
            build_script: ci-linux.sh
            OS_TYPE: default
            PACKAGE_TO_INSTALL: '/ci/build/*.deb'
          - name: fedora34
            image: 'tfcollins/libiio_fedora_34-ci:latest'
            artifactName: 'Linux-Fedora-34'
            build_script: ci-linux.sh
            OS_TYPE: centos
            PACKAGE_TO_INSTALL: '/ci/build/*.rpm'
          - name: opensuse_15_4
            image: 'tfcollins/libiio_opensuse_15_4-ci:latest'
            artifactName: 'Linux-openSUSE-15.4'
            build_script: ci-linux.sh
            OS_TYPE: opensuse
            PACKAGE_TO_INSTALL: '/ci/build/*.rpm'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: 1

      - name: Download libiio build artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: analogdevicesinc/libiio
          workflow: build.yml
          workflow_conclusion: success
          branch: ${{ inputs.download_branch }}
          name: ${{ matrix.artifactName }}
          path: ${{ github.workspace }}/build/
          if_no_artifact_found: fail

      - name: Build
        run: |
          set -e
          sudo docker run --rm -t --privileged \
            -e ARTIFACTNAME=${{ matrix.artifactName }} \
            -v "${{ github.workspace }}":"/ci" \
            "${{ matrix.image }}" \
            /bin/bash -c "cd /ci/ && chmod +x ./CI/travis/${{ matrix.build_script }} && ./CI/travis/${{ matrix.build_script }} ${{ matrix.OS_TYPE }} ${{ matrix.PACKAGE_TO_INSTALL }}"

      - name: Publish build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: |
            ${{ github.workspace }}/build/*.deb
            ${{ github.workspace }}/build/*.rpm
          if-no-files-found: ignore

      - name: Install wheel and twine
        if: ${{ matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        run: |
          sudo pip install setuptools wheel twine build
          cd ${{ github.workspace }}/build/bindings/python
          sudo python setup.py bdist_wheel

      - name: Twine Authenticate (PyPi)
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        run: echo "Configure PyPi credentials via secrets.TWINE_USERNAME / secrets.TWINE_PASSWORD"

      - name: Twine Authenticate (PyPi_Test)
        if: ${{ inputs.is_main == 'true' && matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        run: echo "Configure PyPi test credentials via secrets.TWINE_TEST_USERNAME / secrets.TWINE_TEST_PASSWORD"

      - name: Deploy python package
        if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        env:
          USERNAME: ${{ secrets.TWINE_USERNAME }}
          PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          cd ${{ github.workspace }}/build/bindings/python
          python -m twine upload -u "$USERNAME" -p "$PASSWORD" dist/*.whl

      - name: Update to dev version
        if: ${{ inputs.is_main == 'true' && matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        run: |
          cd ${{ github.workspace }}/build/bindings/python
          sudo rm ./dist/*.whl
          sudo pip3 install --upgrade requests
          sudo pip install invoke
          sudo invoke bumpversion-test
          sudo python -m build
          ls -al
          cd dist
          ls -al

      - name: Deploy python test package
        if: ${{ inputs.is_main == 'true' && matrix.artifactName == 'Linux-Ubuntu-20.04' }}
        env:
          USERNAME: ${{ secrets.TWINE_TEST_USERNAME }}
          PASSWORD: ${{ secrets.TWINE_TEST_PASSWORD }}
        run: |
          cd ${{ github.workspace }}/build/bindings/python
          sudo python -m twine upload --repository-url https://test.pypi.org/legacy/ -u "$USERNAME" -p "$PASSWORD" --skip-existing dist/*.whl
