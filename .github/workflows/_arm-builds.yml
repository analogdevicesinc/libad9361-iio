name: ARM Builds

on:
  workflow_call:
    inputs:
      build-type:
        required: true
        type: string
      libiio-version:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

jobs:
  arm-native:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            platform-flag: ''
            artifact-name: Ubuntu-22.04-arm64v8
          - image: arm32v7/ubuntu:22.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-22.04-arm32v7

          - image: ubuntu:26.04
            platform-flag: ''
            artifact-name: Ubuntu-26.04-arm64v8
          - image: arm32v7/ubuntu:26.04
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Ubuntu-26.04-arm32v7

          - image: debian:bookworm
            platform-flag: ''
            artifact-name: Debian-12-arm64
          - image: arm32v7/debian:bookworm
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-12-armhf

          - image: docker.cloudsmith.io/adi/containers/kuiper_basic_64@sha256:2a4b203ca34cf660339f8d8a5b32d290ae3c4918e18c0473902e2c12c86ca129 # latest
            platform-flag: ''
            artifact-name: Debian-13-arm64
          - image: docker.cloudsmith.io/adi/containers/kuiper_basic_32@sha256:ce9c5eba9dc120595e42142665aa11ded7317181c01c14c190e86835cfef9c8a # latest
            platform-flag: '--platform linux/arm/v7'
            artifact-name: Debian-13-armhf
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Setup Python venv and install dependencies
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv --seed
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests

      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-libiio
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-name: ${{ matrix.artifact-name }}.deb
          package-version: ${{ inputs.libiio-version }}
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Build
        run: |
          set -e
          docker run \
            ${{ matrix.platform-flag }} \
            --rm -t \
            -e ARTIFACTNAME=${{ matrix.artifact-name }} \
            -e CMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -v "${{ github.workspace }}":"/ci" \
            "${{ matrix.image }}" \
            /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential cmake git libxml2-dev python3-setuptools curl ca-certificates python3-lxml
              curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
              # lxml ships no wheel for s390x/ppc64le, so reuse the distro build rather than compiling it under QEMU.
              uv venv --seed --system-site-packages /tmp/venv
              . /tmp/venv/bin/activate
              cd /ci
              bash ./CI/travis/ci-ubuntu.sh
            "
      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/*9361*.deb
            build/*9361*.tar.gz
          if-no-files-found: error

  cross-arch:
    name: ${{ matrix.artifact-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            arch: ppc64le
            artifact-name: Ubuntu-22.04-ppc64le
          - image: ubuntu:22.04
            arch: s390x
            artifact-name: Ubuntu-22.04-s390x
          - image: ubuntu:26.04
            arch: ppc64le
            artifact-name: Ubuntu-26.04-ppc64le
          - image: ubuntu:26.04
            arch: s390x
            artifact-name: Ubuntu-26.04-s390x
    env:
      ARTIFACTNAME: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Setup Python venv and install dependencies
        run: |
          set -e
          uv python install 3.11
          uv venv --python 3.11 /tmp/cloudsmith-venv --seed
          uv pip install --python /tmp/cloudsmith-venv/bin/python3 requests

      - name: Get libiio from Cloudsmith
        uses: ./.github/actions/get-libiio
        with:
          cloudsmith-api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          package-name: ${{ matrix.artifact-name }}.deb
          package-version: ${{ inputs.libiio-version }}
          python: /tmp/cloudsmith-venv/bin/python3

      - name: Build
        run: |
          set -e
          sudo docker run \
            --platform "linux/${{ matrix.arch }}" \
            --rm -t \
            -e ARTIFACTNAME=${{ matrix.artifact-name }} \
            -e CMAKE_BUILD_TYPE=${{ inputs.build-type }} \
            -v "${{ github.workspace }}":"/ci" \
            "${{ matrix.image }}" \
            /bin/bash -c "
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y build-essential cmake git libxml2-dev python3-setuptools curl ca-certificates python3-lxml
              curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
              # lxml ships no wheel for s390x/ppc64le, so reuse the distro build rather than compiling it under QEMU.
              uv venv --seed --system-site-packages /tmp/venv
              . /tmp/venv/bin/activate
              cd /ci
              bash ./CI/travis/ci-ubuntu.sh
            "

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            build/*9361*.deb
            build/*9361*.tar.gz
          if-no-files-found: error
