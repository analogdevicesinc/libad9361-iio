name: Scheduled v0 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 * *'    # Monthly, 1st of the month at 6am UTC

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v0 build
        run: gh workflow run build.yml --ref libad9361-iio-v0 --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
