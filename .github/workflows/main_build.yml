name: Main Build

on:
  push:
    branches:
      - main
      - next_stable
      - libad9361-iio-v0
      - staging/*
      - '20*'
    tags:
      - v*
  pull_request:
    branches:
      - main
      - next_stable
      - libad9361-iio-v0
      - '20*'
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      download_branch: ${{ steps.vars.outputs.download_branch }}
      checkout_ref: ${{ steps.vars.outputs.checkout_ref }}
      is_main: ${{ steps.vars.outputs.is_main }}
    steps:
      - name: Compute shared variables
        id: vars
        shell: bash
        run: |
          event="${{ github.event_name }}"
          ref_name="${{ github.ref_name }}"
          base="${{ github.base_ref }}"

          if [ "$event" = "schedule" ]; then
            checkout_ref="libad9361-iio-v0"
            branch="libad9361-iio-v0"
          else
            checkout_ref=""
            branch="$ref_name"
          fi

          if [ "$event" = "pull_request" ]; then
            download_branch="${base/libad9361-iio-v0/libiio-v0}"
          elif [ "$branch" = "libad9361-iio-v0" ]; then
            download_branch="libiio-v0"
          elif [ "$branch" = "next_stable" ]; then
            download_branch="next_stable"
          elif [[ "$branch" == 20* ]]; then
            download_branch="$branch"
          else
            download_branch="main"
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_main="true"
          else
            is_main="false"
          fi

          echo "download_branch=$download_branch" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "is_main=$is_main" >> "$GITHUB_OUTPUT"
          echo "Resolved download_branch=$download_branch checkout_ref='$checkout_ref' is_main=$is_main"

  linux-builds:
    needs: prepare
    uses: ./.github/workflows/_linux-builds.yml
    with:
      download_branch: ${{ needs.prepare.outputs.download_branch }}
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
      is_main: ${{ needs.prepare.outputs.is_main }}
    secrets: inherit

  arm-builds:
    needs: prepare
    uses: ./.github/workflows/_arm-builds.yml
    with:
      download_branch: ${{ needs.prepare.outputs.download_branch }}
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
    secrets: inherit

  macos-builds:
    needs: prepare
    uses: ./.github/workflows/_macos-builds.yml
    with:
      download_branch: ${{ needs.prepare.outputs.download_branch }}
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
    secrets: inherit

  windows-builds:
    needs: prepare
    uses: ./.github/workflows/_windows-builds.yml
    with:
      download_branch: ${{ needs.prepare.outputs.download_branch }}
      checkout_ref: ${{ needs.prepare.outputs.checkout_ref }}
    secrets: inherit
